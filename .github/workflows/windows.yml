name: Windows CI

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'resources/**'
      - 'assets/**'
      - 'third_party/**'
      - 'packaging/**'
      - 'CMakeLists.txt'
      - 'VERSION'
      - '.github/workflows/windows.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-package:
    name: Release, tests and Setup / Compilación, pruebas y Setup
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: '2'
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout source / Obtener código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build, test and package / Compilar, probar y empaquetar
        run: ./packaging/build-setup.ps1 -BuildDirectory build
      - name: Installer round trip / Instalación y desinstalación
        run: ./packaging/test-setup.ps1
      - name: Summary / Resumen
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          $tests = ctest --test-dir build -C Release --show-only=json-v1 | ConvertFrom-Json
          if ($LASTEXITCODE) { throw 'Could not read the test list.' }
          "AULA Control $version · Windows x64 · $($tests.tests.Count) tests passed / pruebas aprobadas" >> $env:GITHUB_STEP_SUMMARY
          'Unsigned installer generated. No release published. / Setup sin firma generado. No se ha publicado ninguna versión.' >> $env:GITHUB_STEP_SUMMARY
      - name: Upload installer / Guardar instalador
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: AULA-Control-Windows-x64-${{ github.run_number }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7
      - name: Diagnostic logs / Registros de diagnóstico
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Windows-CI-diagnostics-${{ github.run_number }}
          path: |
            build/**/*.log
            build/**/CMakeConfigureLog.yaml
          if-no-files-found: ignore
          retention-days: 7
